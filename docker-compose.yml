services:
  guptarealty:
    build: .
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 768M
    environment:
      - JAVA_OPTS=-Xmx512m
      - PORT=8080
      - ASSETS_PATH=/app/assets
      - BEARER_TOKEN=${BEARER_TOKEN}
      - FUB_API_KEY=${FUB_API_KEY}
    volumes:
      - assets_data:/app/assets
      - static_data:/app/site/static
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/usr/share/nginx/html:ro
      - assets_data:/app/assets:ro
    depends_on:
      guptarealty:
        condition: service_healthy
    restart: unless-stopped

volumes:
    assets_data:
    static_data:
